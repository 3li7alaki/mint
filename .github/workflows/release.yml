name: Release
on:
  push:
    branches: [main]
    paths:
      - 'package.json'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check if version changed
        id: version
        run: |
          NEW=$(grep -o '"version": "[^"]*"' package.json | head -1 | grep -o '[0-9][0-9.]*')
          OLD=$(git show HEAD~1:package.json 2>/dev/null | grep -o '"version": "[^"]*"' | head -1 | grep -o '[0-9][0-9.]*' || echo "0.0.0")
          echo "new=$NEW" >> $GITHUB_OUTPUT
          echo "old=$OLD" >> $GITHUB_OUTPUT
          if [ "$NEW" != "$OLD" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Version changed: $OLD → $NEW"
          else
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "Version unchanged: $NEW"
          fi

      - uses: oven-sh/setup-bun@v2
        if: steps.version.outputs.changed == 'true'
      - run: bun install --frozen-lockfile
        if: steps.version.outputs.changed == 'true'
      - run: bun test
        if: steps.version.outputs.changed == 'true'

      - name: Create tag and release
        if: steps.version.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="v${{ steps.version.outputs.new }}"
          git tag "$VERSION"
          git push origin "$VERSION"
          gh release create "$VERSION" --generate-notes --title "$VERSION"
